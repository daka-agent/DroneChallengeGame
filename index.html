<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雾都飞升：无人机挑战</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #gameWrapper {
      position: relative;
      width: 420px;
      height: 640px;
    }

    canvas {
      display: block;
      border: 2px solid #00e5ff44;
      border-radius: 8px;
      box-shadow: 0 0 40px #00e5ff22, 0 0 80px #00e5ff11;
    }

    #ui-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      border-radius: 8px;
      overflow: hidden;
    }

    /* 顶部 HUD */
    #hud {
      position: absolute;
      top: 12px; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 16px;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0,0,0,0.55);
      border: 1px solid #00e5ff55;
      border-radius: 6px;
      padding: 5px 12px;
      color: #00e5ff;
      font-size: 13px;
      line-height: 1.6;
      text-shadow: 0 0 8px #00e5ff;
    }

    /* 音效开关 */
    #soundToggle {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      border: 1px solid #00e5ff44;
      border-radius: 20px;
      color: #00e5ff;
      font-size: 16px;
      padding: 3px 14px;
      cursor: pointer;
      pointer-events: all;
      user-select: none;
      letter-spacing: 1px;
      transition: background 0.2s, border-color 0.2s;
    }
    #soundToggle:hover { background: rgba(0,229,255,0.15); border-color: #00e5ff88; }
    #soundToggle.off { color: #4a7a9b; border-color: #4a7a9b44; }

    .hud-label { color: #7ecfff; font-size: 11px; }
    .hud-value { font-size: 16px; font-weight: bold; letter-spacing: 1px; }

    /* 开始界面 */
    #startScreen {
      position: absolute;
      inset: 0;
      background: rgba(8,10,30,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      pointer-events: all;
      cursor: pointer;
    }

    #startScreen .title {
      font-size: 26px;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff66;
      letter-spacing: 3px;
      margin-bottom: 8px;
      animation: glow 2s ease-in-out infinite alternate;
    }
    #startScreen .subtitle {
      font-size: 13px;
      color: #7ecfff88;
      letter-spacing: 6px;
      margin-bottom: 48px;
    }
    #startScreen .start-hint {
      font-size: 16px;
      color: #fff;
      background: #00e5ff22;
      border: 1px solid #00e5ff55;
      border-radius: 30px;
      padding: 10px 30px;
      letter-spacing: 2px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #startScreen .tip {
      margin-top: 28px;
      font-size: 12px;
      color: #4a7a9b;
      line-height: 1.9;
      text-align: center;
      letter-spacing: 1px;
    }
    #startScreen .drone-icon {
      font-size: 52px;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 14px #00e5ff);
      animation: hover-anim 2.5s ease-in-out infinite;
    }

    /* 游戏结束界面 */
    #gameOverScreen {
      position: absolute;
      inset: 0;
      background: rgba(8,10,30,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      pointer-events: all;
      cursor: pointer;
    }

    #gameOverScreen.show { display: flex; }

    #gameOverScreen .over-title {
      font-size: 34px;
      font-weight: bold;
      color: #ff4466;
      text-shadow: 0 0 20px #ff4466, 0 0 40px #ff446666;
      letter-spacing: 4px;
      margin-bottom: 6px;
      animation: shake 0.4s ease-in-out 3;
    }
    #gameOverScreen .over-sub {
      font-size: 12px;
      color: #ff446688;
      letter-spacing: 5px;
      margin-bottom: 36px;
    }
    #gameOverScreen .score-block {
      background: rgba(0,0,0,0.4);
      border: 1px solid #00e5ff44;
      border-radius: 10px;
      padding: 18px 36px;
      text-align: center;
      margin-bottom: 32px;
      min-width: 220px;
    }
    #gameOverScreen .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 7px 0;
    }
    .score-lbl { color: #7ecfff; font-size: 12px; letter-spacing: 1px; }
    .score-val { color: #fff; font-size: 20px; font-weight: bold;
                 text-shadow: 0 0 8px #00e5ff; }
    .score-val.best { color: #ffd700; text-shadow: 0 0 8px #ffd700; }
    #gameOverScreen .restart-btn {
      font-size: 15px;
      color: #fff;
      background: #00e5ff22;
      border: 1px solid #00e5ff88;
      border-radius: 30px;
      padding: 10px 36px;
      letter-spacing: 2px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes glow {
      from { text-shadow: 0 0 12px #00e5ff, 0 0 24px #00e5ff44; }
      to   { text-shadow: 0 0 28px #00e5ff, 0 0 60px #00e5ff88; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.65; transform: scale(0.97); }
    }
    @keyframes hover-anim {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* 关卡区域公告 */
    #zoneAnnounce {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 6px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      text-transform: uppercase;
    }
    #zoneAnnounce.show {
      animation: zoneAnim 2.5s ease forwards;
    }
    @keyframes zoneAnim {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }

    /* HUD 区域标签 */
    #zoneDisplay {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 3px;
      padding: 2px 10px;
      border-radius: 10px;
      opacity: 0.85;
      pointer-events: none;
      transition: color 0.5s, background 0.5s;
    }
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="420" height="640"></canvas>

  <div id="ui-overlay">
    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">当前高度</div>
        <div class="hud-value" id="scoreDisplay">0 m</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">最高记录</div>
        <div class="hud-value" id="bestDisplay">0 m</div>
      </div>
    </div>

    <!-- 音效开关 -->
    <div id="soundToggle" title="音效开关">🔊</div>

    <!-- 关卡区域标签（运行时显示） -->
    <div id="zoneDisplay"></div>

    <!-- 关卡区域公告（过渡时显示） -->
    <div id="zoneAnnounce"></div>

    <!-- 开始界面 -->
    <div id="startScreen">
      <div class="drone-icon">🚁</div>
      <div class="title">雾都飞升</div>
      <div class="subtitle">无 人 机 挑 战</div>
      <div class="start-hint">按 空格键 开始游戏</div>
      <div class="tip">
        ← → 方向键控制左右移动<br>
        无人机自动持续跳跃，向上爬升<br>
        跌落底部则游戏结束
      </div>
    </div>

    <!-- 游戏结束界面 -->
    <div id="gameOverScreen">
      <div class="over-title">GAME OVER</div>
      <div class="over-sub">无人机已坠落</div>
      <div class="score-block">
        <div class="score-row">
          <span class="score-lbl">本次高度</span>
          <span class="score-val" id="finalScore">0 m</span>
        </div>
        <div class="score-row">
          <span class="score-lbl">最高阶段</span>
          <span class="score-val" id="finalStage" style="font-size:14px;">SLOW</span>
        </div>
        <div class="score-row">
          <span class="score-lbl">历史最高</span>
          <span class="score-val best" id="finalBest">0 m</span>
        </div>
      </div>
      <div class="restart-btn">按 空格键 重新开始</div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  雾都飞升：无人机挑战  —— 完整游戏逻辑
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// ---------- DOM ----------
const scoreDisplay = document.getElementById('scoreDisplay');
const bestDisplay  = document.getElementById('bestDisplay');
const startScreen  = document.getElementById('startScreen');
const gameOverScr  = document.getElementById('gameOverScreen');
const finalScore   = document.getElementById('finalScore');
const finalStage   = document.getElementById('finalStage');
const finalBest    = document.getElementById('finalBest');

// ============================================================
//  常量与配置
// ============================================================
const GRAVITY_BASE  = 0.38;       // 基础重力
const JUMP_BASE     = -10.5;      // 基础跳跃速度
const JUMP_MAX_MULT = 2.4;        // 跳跃速度最大倍率（越高倍率越大）
const MOVE_SPEED    = 4.2;        // 左右移动速度
const PLAT_W_MIN    = 42;         // 平台最小宽度（高处更窄）
const PLAT_W_MAX    = 110;        // 平台初始最大宽度
const PLAT_GAP_MIN  = 60;         // 平台竖向最小间距
const PLAT_GAP_MAX  = 110;        // 平台初始最大间距
const SPEED_INC     = 0.00018;    // 每帧速度增量（滚动速度）
const SCROLL_BASE   = 1.8;        // 初始滚动速度（像素/帧）
const SCROLL_MAX    = 7.5;        // 最大滚动速度（提高上限）

// 难度阶段定义（按高度分阶段）
const DIFFICULTY_STAGES = [
  { height: 0,    label: 'SLOW',  color: '#00e5ff', jumpMult: 1.00, gravMult: 1.00, gapBonus: 0,  widthMult: 1.00 },
  { height: 100,  label: 'MED',   color: '#88ff44', jumpMult: 1.25, gravMult: 1.05, gapBonus: 15, widthMult: 0.90 },
  { height: 250,  label: 'FAST',  color: '#ffcc00', jumpMult: 1.55, gravMult: 1.10, gapBonus: 30, widthMult: 0.78 },
  { height: 500,  label: 'MACH',  color: '#ff7700', jumpMult: 1.90, gravMult: 1.16, gapBonus: 48, widthMult: 0.65 },
  { height: 900,  label: 'ULTRA', color: '#ff3366', jumpMult: 2.40, gravMult: 1.24, gapBonus: 65, widthMult: 0.54 },
];

// ============================================================
//  关卡区域定义（按高度划分主题区）
// ============================================================
const ZONES = [
  {
    name: '城市区',
    sub: 'URBAN ZONE',
    height: 0,
    color: '#00e5ff',
    bgTop: '#05050f',
    bgBot: '#1a2a50',
    platColor: ['#3a6ea8', '#1a3a5c'],
    platGlow: '#00c8ff',
    hazards: false,
    moving: 0.10,
    special: 0,
  },
  {
    name: '工业区',
    sub: 'INDUSTRIAL ZONE',
    height: 300,
    color: '#ff9900',
    bgTop: '#0a0805',
    bgBot: '#2a1a08',
    platColor: ['#a06020', '#5a2c0a'],
    platGlow: '#ff8800',
    hazards: false,
    moving: 0.35,
    special: 0.15,
  },
  {
    name: '云层区',
    sub: 'CLOUD ZONE',
    height: 700,
    color: '#cc88ff',
    bgTop: '#0d0520',
    bgBot: '#2a1545',
    platColor: ['#8855cc', '#3a1a6a'],
    platGlow: '#bb66ff',
    hazards: true,
    moving: 0.50,
    special: 0.28,
  },
  {
    name: '风暴区',
    sub: 'STORM ZONE',
    height: 1200,
    color: '#ff3366',
    bgTop: '#0d0008',
    bgBot: '#25001a',
    platColor: ['#cc2255', '#550022'],
    platGlow: '#ff0055',
    hazards: true,
    moving: 0.65,
    special: 0.40,
  },
];

// 平台类型
const PLAT_TYPE = {
  NORMAL: 0,
  MOVING: 1,
  ICE: 2,
  BREAKABLE: 3,
};

// 障碍物类型
const HAZ_TYPE = {
  SPIKE: 0,
  LASER: 1,
  WIND: 2,
};

// 道具类型
const ITEM_TYPE = {
  SHIELD: 0,
  MAGNET: 1,
};

// 道具持续时间
const SHIELD_DURATION = 8000; // 8秒护盾
const DRONE_W       = 44;
const DRONE_H       = 22;

// ============================================================
//  游戏状态
// ============================================================
let state = 'idle'; // idle | running | over
let bestHeight = 0;

let drone, platforms, scrollY, currentHeight, scrollSpeed, frameCount;
let keys = { left: false, right: false };
let currentStage = DIFFICULTY_STAGES[0]; // 当前难度阶段
let stageFlash = 0; // 阶段升级闪光计时器

// 新增游戏对象
let hazards = [];      // 危险物数组
let powerups = [];     // 道具数组
let windZones = [];    // 风场区域
let currentZone = ZONES[0]; // 当前关卡区域
let zoneAnnounceTimer = 0;   // 区域公告计时器
let shieldActive = false;    // 护盾状态
let shieldTimer = 0;         // 护盾剩余时间
let iceTimer = 0;            // 冰面计时器（冰面上减速停止感）
let announceId = 0;          // 公告编号（防重复触发）

// 获取当前难度阶段
function getDifficultyStage(height) {
  let stage = DIFFICULTY_STAGES[0];
  for (const s of DIFFICULTY_STAGES) {
    if (height >= s.height) stage = s;
  }
  return stage;
}

// 获取当前关卡区域
function getCurrentZone(height) {
  let zone = ZONES[0];
  for (const z of ZONES) {
    if (height >= z.height) zone = z;
  }
  return zone;
}

// 显示区域公告
function showZoneAnnounce(zone) {
  announceId++;
  const el = document.getElementById('zoneAnnounce');
  el.textContent = zone.name;
  el.style.color = zone.color;
  el.style.textShadow = `0 0 20px ${zone.color}, 0 0 40px ${zone.color}66`;
  el.classList.remove('show');
  void el.offsetWidth; // 强制重绘
  el.classList.add('show');
  zoneAnnounceTimer = 150; // 约2.5秒

  // 更新 HUD 区域标签
  const zEl = document.getElementById('zoneDisplay');
  zEl.textContent = zone.sub;
  zEl.style.color = zone.color;
  zEl.style.background = zone.color + '22';
  zEl.style.border = `1px solid ${zone.color}66`;
}

// ============================================================
//  音效系统（Web Audio API 程序化合成）
// ============================================================
let audioCtx = null;
let soundEnabled = true;
let lastMilestone = 0;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function getToggle() {
  return document.getElementById('soundToggle');
}

// 音效开关
getToggle() && getToggle().addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  const btn = getToggle();
  if (soundEnabled) {
    btn.textContent = '🔊';
    btn.classList.remove('off');
  } else {
    btn.textContent = '🔇';
    btn.classList.add('off');
  }
});

function playJump() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  // 跳跃音调随难度阶段升高（阶段越高音越尖锐）
  const freqBase = 400 + currentStage.jumpMult * 120;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freqBase, t);
  osc.frequency.exponentialRampToValueAtTime(freqBase * 1.75, t + 0.07);
  osc.frequency.exponentialRampToValueAtTime(freqBase * 0.75, t + 0.14);
  gain.gain.setValueAtTime(0.18, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.start(t); osc.stop(t + 0.15);
}

function playLand() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const bufSize = audioCtx.sampleRate * 0.05;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = 400;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.12, t);
  src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);
}

function playMilestone() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  // 上升音阶
  [523, 659, 784, 1047].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const st = t + i * 0.07;
    gain.gain.setValueAtTime(0, st);
    gain.gain.linearRampToValueAtTime(0.2, st + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.25);
    osc.start(st); osc.stop(st + 0.25);
  });
}

function playGameOver() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  // 下落音调
  [440, 330, 220, 110].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    const st = t + i * 0.12;
    gain.gain.setValueAtTime(0.15, st);
    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.3);
    osc.start(st); osc.stop(st + 0.3);
  });
  // 加一声低沉轰鸣
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.connect(gain2); gain2.connect(audioCtx.destination);
  osc2.type = 'sine'; osc2.frequency.value = 55;
  gain2.gain.setValueAtTime(0.3, t + 0.4);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
  osc2.start(t + 0.4); osc2.stop(t + 1.2);
}

function playStart() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  // 上升启动音
  [262, 330, 392, 523].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const st = t + i * 0.06;
    gain.gain.setValueAtTime(0.15, st);
    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.2);
    osc.start(st); osc.stop(st + 0.2);
  });
}

function playShield() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  [800, 1200, 1600].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const st = t + i * 0.06;
    gain.gain.setValueAtTime(0.15, st);
    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.2);
    osc.start(st); osc.stop(st + 0.2);
  });
}

function playBreak() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const bufSize = Math.floor(audioCtx.sampleRate * 0.12);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = 600; filt.Q.value = 1;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.18, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);
}

function playIce() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(2000, t);
  osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
  gain.gain.setValueAtTime(0.06, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.start(t); osc.stop(t + 0.1);
}

// ============================================================
//  粒子系统（推进器尾焰）
// ============================================================
let particles = [];

function spawnParticle(x, y) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 1.2,
    vy: Math.random() * 2 + 1,
    life: 1,
    size: Math.random() * 4 + 2,
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.06;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ============================================================
//  障碍物系统
// ============================================================
function spawnHazard(platform) {
  const type = Math.floor(Math.random() * 3); // 0=钉刺 1=激光 2=风场
  const x = platform.x + Math.random() * (platform.w - 30);
  hazards.push({
    type,
    x: x,
    y: platform.y - 22,
    w: 30,
    h: 18,
    timer: Math.random() * 120,
    period: 80 + Math.random() * 80,
  });
}

function spawnHazardForPlatform(platform) {
  if (!currentZone.hazards) return;
  if (Math.random() < 0.25) spawnHazard(platform);
}

function updateHazards() {
  for (const h of hazards) {
    h.timer++;
    // 激光周期性开关
    if (h.type === HAZ_TYPE.LASER) {
      h.on = Math.floor(h.timer % h.period) < h.period * 0.55;
    }
  }
}

function drawHazards() {
  for (const h of hazards) {
    if (h.type === HAZ_TYPE.SPIKE) {
      // 钉刺球
      ctx.fillStyle = '#ff3344';
      ctx.shadowColor = '#ff3344';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(h.x + 15, h.y + 9, 9, 0, Math.PI * 2);
      ctx.fill();
      // 三角形尖刺
      ctx.fillStyle = '#ff6677';
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(h.x + 15, h.y + 9);
        ctx.lineTo(h.x + 15 + Math.cos(angle) * 14, h.y + 9 + Math.sin(angle) * 14);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    } else if (h.type === HAZ_TYPE.LASER) {
      // 激光束
      if (h.on) {
        ctx.strokeStyle = '#ff0044';
        ctx.shadowColor = '#ff0044';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(h.x, h.y - 40);
        ctx.lineTo(h.x, h.y);
        ctx.stroke();
        // 激光发射器
        ctx.fillStyle = '#880022';
        ctx.fillRect(h.x - 6, h.y - 6, 12, 8);
        ctx.shadowBlur = 0;
      } else {
        // 关闭状态
        ctx.fillStyle = '#442244';
        ctx.fillRect(h.x - 6, h.y - 6, 12, 8);
      }
    } else if (h.type === HAZ_TYPE.WIND) {
      // 风场指示
      ctx.fillStyle = 'rgba(100,200,255,0.15)';
      ctx.beginPath();
      ctx.ellipse(h.x + 15, h.y + 9, 20, 40, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(100,200,255,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function spawnPowerup(platform) {
  const x = platform.x + platform.w / 2;

    x: x,
    y: platform.y - 28,
    vy: 0,

function spawnPowerupForPlatform(platform) {

function updatePowerups() {
  for (const p of powerups) {

function drawPowerups() {

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pulse, pulse);

    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = 'bold 12px Arial';

// ============================================================
//  平台
// ============================================================
function makePlatform(y, first) {
  const wMax = PLAT_W_MAX * currentStage.widthMult;
  const wMin = Math.min(PLAT_W_MIN, wMax - 8);
  const w = first ? 100 : wMin + Math.random() * (wMax - wMin);
  const x = first ? (W - w) / 2 : Math.random() * (W - w - 10) + 5;

  // 根据当前区域的特殊平台概率决定平台类型
  let platType = PLAT_TYPE.NORMAL;
  if (!first && currentZone.special > 0 && Math.random() < currentZone.special) {
    const roll = Math.random();
    if (roll < 0.45) platType = PLAT_TYPE.MOVING;
    else if (roll < 0.75) platType = PLAT_TYPE.BREAKABLE;
    else platType = PLAT_TYPE.ICE;
  }

  return {
    x, y, w, h: 14, glow: Math.random() > 0.6,
    type: platType,
    originX: x,            // 移动平台的原始X
    vx: platType === PLAT_TYPE.MOVING ? (Math.random() > 0.5 ? 1.2 : -1.2) : 0,
    breakTimer: platType === PLAT_TYPE.BREAKABLE ? 120 : 0, // 2秒后消失（60帧/秒）
    blinkTimer: 0,         // 闪烁计时
    visible: true,
  };
}

function generateInitialPlatforms() {
  platforms = [];
  // 底部起始平台（宽大方便落脚）
  platforms.push({ x: W / 2 - 70, y: H - 80, w: 140, h: 14, glow: false, visible: true });
  let y = H - 80;
  for (let i = 0; i < 16; i++) {
    y -= PLAT_GAP_MIN + Math.random() * (PLAT_GAP_MAX - PLAT_GAP_MIN);
    platforms.push(makePlatform(y, false));
  }
}

function drawPlatform(p) {
  if (!p.visible) return;

  // 平台不可见时直接返回
  const blinkAlpha = p.breakTimer > 0 && p.breakTimer < 40
    ? (Math.floor(p.breakTimer / 4) % 2 === 0 ? 0.3 : 1.0)
    : 1.0;
  ctx.globalAlpha = blinkAlpha;

  // 平台底部阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(p.x + 4, p.y + p.h, p.w - 8, 6);

  // 平台主体渐变（根据类型变色）
  const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  let topColor, botColor, glowColor;
  switch (p.type) {
    case PLAT_TYPE.MOVING:
      topColor = '#00ccff'; botColor = '#004466'; glowColor = '#00e5ff';
      break;
    case PLAT_TYPE.ICE:
      topColor = '#aaeeff'; botColor = '#336688'; glowColor = '#88ddff';
      break;
    case PLAT_TYPE.BREAKABLE:
      topColor = currentZone.color; botColor = '#552200'; glowColor = '#ff6600';
      break;
    default:
      topColor = p.glow ? currentZone.platGlow : currentZone.platColor[0];
      botColor = currentZone.platColor[1];
      glowColor = currentZone.platGlow;
  }
  grad.addColorStop(0, topColor);
  grad.addColorStop(1, botColor);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(p.x, p.y, p.w, p.h, 4);
  ctx.fill();

  // 冰面平台特殊效果
  if (p.type === PLAT_TYPE.ICE) {
    ctx.fillStyle = 'rgba(200,240,255,0.3)';
    ctx.beginPath();
    ctx.roundRect(p.x + 2, p.y + 1, p.w - 4, 5, 2);
    ctx.fill();
  }

  // 消失平台警告条纹
  if (p.type === PLAT_TYPE.BREAKABLE && p.breakTimer > 0 && p.breakTimer < 60) {
    ctx.strokeStyle = '#ff0000aa';
    ctx.lineWidth = 2;
    for (let sx = p.x; sx < p.x + p.w; sx += 10) {
      ctx.beginPath();
      ctx.moveTo(sx, p.y);
      ctx.lineTo(sx + 6, p.y + p.h);
      ctx.stroke();
    }
  }

  // 顶部高光
  ctx.fillStyle = topColor + '88';
  ctx.beginPath();
  ctx.roundRect(p.x + 2, p.y + 1, p.w - 4, 4, 2);
  ctx.fill();

  // 发光描边
  if (p.glow || p.type !== PLAT_TYPE.NORMAL) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 14;
    ctx.strokeStyle = topColor + 'cc';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 4);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.globalAlpha = 1;
}

function drawDrone(x, y, vy) {
  const cx = x + DRONE_W / 2;

  // 推进器尾焰粒子

  ctx.shadowBlur = 16;

  // 机体中央面板
  const bodyGrad = ctx.createLinearGradient(x, y + 5, x, y + DRONE_H);
  bodyGrad.addColorStop(0, '#3a7aaa');
  bodyGrad.addColorStop(1, '#0d2540');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.roundRect(x + 8, y + 8, DRONE_W - 16, DRONE_H - 12, 3);
  ctx.fill();

  // 摄像头
  ctx.fillStyle = '#00e5ff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(cx, cy + 1, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#001525';
  ctx.beginPath();
  ctx.arc(cx, cy + 1, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // 四条旋翼臂
  const armPositions = [
    { ax: x + 4,         ay: y + 6 },
    { ax: x + DRONE_W - 4, ay: y + 6 },
  ];

  ctx.strokeStyle = '#4a8ab8';
  ctx.lineWidth = 2;
  // 左臂
  ctx.beginPath(); ctx.moveTo(cx - 6, cy);
  ctx.lineTo(x + 2, y + 2); ctx.stroke();
  // 右臂
  ctx.beginPath(); ctx.moveTo(cx + 6, cy);
  ctx.lineTo(x + DRONE_W - 2, y + 2); ctx.stroke();

  // 旋翼（前左、前右）
  const propTime = frameCount * 0.45;
  drawProp(x + 2,         y + 2, 14, propTime);
  drawProp(x + DRONE_W - 2, y + 2, 14, propTime + Math.PI);

  // 指示灯
  ctx.fillStyle = vy < 0 ? '#00ff88' : '#ff4455';
  ctx.shadowColor = vy < 0 ? '#00ff88' : '#ff4455';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(x + DRONE_W - 10, y + 9, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawProp(cx, cy, len, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.strokeStyle = 'rgba(180,230,255,0.75)';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-len / 2, 0);
  ctx.lineTo(len / 2, 0);
  ctx.stroke();
  ctx.rotate(Math.PI / 2);
  ctx.strokeStyle = 'rgba(180,230,255,0.45)';
  ctx.beginPath();
  ctx.moveTo(-len / 3, 0);
  ctx.lineTo(len / 3, 0);
  ctx.stroke();
  ctx.restore();
}

// ============================================================
//  初始化
// ============================================================
function initGame() {
  scrollY = 0;
  currentHeight = 0;
  scrollSpeed = SCROLL_BASE;
  frameCount = 0;
  particles = [];
  currentStage = DIFFICULTY_STAGES[0];
  stageFlash = 0;
  currentZone = ZONES[0];
  zoneAnnounceTimer = 0;
  hazards = [];
  powerups = [];
  windZones = [];
  shieldActive = false;
  shieldTimer = 0;
  announceId = 0;
  lastMilestone = 0;

  generateInitialPlatforms();

  // 无人机初始位置：起始平台上方
  const startPlat = platforms[0];
  drone = {
    x: W / 2 - DRONE_W / 2,
    y: startPlat.y - DRONE_H - 2,
    vx: 0,
    vy: 0,
    onGround: false,
  };
}

// ============================================================
//  碰撞检测（只检测向下穿过平台）
// ============================================================
function checkPlatformCollision() {
  if (drone.vy < 0) return; // 上升时不检测

  const dBot = drone.y + DRONE_H;
  const prevBot = dBot - drone.vy;

  for (const p of platforms) {
    if (
      drone.x + DRONE_W > p.x + 4 &&
      drone.x < p.x + p.w - 4 &&
      prevBot <= p.y + 2 &&
      dBot >= p.y
    ) {
      drone.y = p.y - DRONE_H;
      drone.vy = 0;
      drone.onGround = true;
      playLand();
      if (p.type === PLAT_TYPE.ICE) playIce();
      return;
    }
  }
}

// ============================================================
//  自动跳跃
// ============================================================
function autoJump() {
  if (drone.onGround) {
    // 跳跃速度 = 基础值 × 当前阶段倍率，再叠加高度平滑加速（阶段内线性过渡）
    const stageIdx = DIFFICULTY_STAGES.indexOf(currentStage);
    const nextStage = DIFFICULTY_STAGES[stageIdx + 1];
    let mult;
    if (nextStage) {
      const progress = Math.min(1, (currentHeight - currentStage.height) / (nextStage.height - currentStage.height));
      mult = currentStage.jumpMult + (nextStage.jumpMult - currentStage.jumpMult) * progress;
    } else {
      // 最高阶段后继续平滑增加，但有上限
      mult = Math.min(currentStage.jumpMult + (currentHeight - currentStage.height) * 0.0004, JUMP_MAX_MULT);
    }
    drone.vy = JUMP_BASE * mult;
    drone.onGround = false;
    playJump();
  }
}

// ============================================================
//  滚动与平台管理
// ============================================================
function scrollWorld() {
  // 当无人机到达屏幕上方 40% 时，开始滚动世界
  const scrollThreshold = H * 0.38;

  if (drone.y < scrollThreshold) {
    const delta = scrollThreshold - drone.y;
    drone.y = scrollThreshold;

    for (const p of platforms) p.y += delta;
    for (const h of hazards) h.y += delta;
    for (const pw of powerups) pw.y += delta;
    for (const w of windZones) w.y += delta;
    scrollY += delta;
    currentHeight = Math.round(scrollY / 10);
  }
}

function managePlatforms() {
  // 删除屏幕底部以下的平台、障碍物、道具
  for (let i = platforms.length - 1; i >= 0; i--) {
    if (platforms[i].y > H + 20) platforms.splice(i, 1);
  }
  for (let i = hazards.length - 1; i >= 0; i--) {
    if (hazards[i].y > H + 50) hazards.splice(i, 1);
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    if (powerups[i].y > H + 50) powerups.splice(i, 1);
  }
  for (let i = windZones.length - 1; i >= 0; i--) {
    if (windZones[i].y > H + 50) windZones.splice(i, 1);
  }

  // 在顶部补充平台（间距随难度增大）
  const gapMin = PLAT_GAP_MIN + currentStage.gapBonus;
  const gapMax = PLAT_GAP_MAX + currentStage.gapBonus;
  while (true) {
    const topPlat = platforms.reduce((a, b) => a.y < b.y ? a : b);
    if (topPlat.y > 0) {
      const gap = gapMin + Math.random() * (gapMax - gapMin);
      const newPlat = makePlatform(topPlat.y - gap, false);
      platforms.push(newPlat);
      // 在该平台生成障碍物或道具
      spawnHazardForPlatform(newPlat);
      spawnPowerupForPlatform(newPlat);
    } else break;
  }
}

// ============================================================
//  主游戏循环
// ============================================================
function update() {
  if (state !== 'running') return;

  frameCount++;

  // 速度递增
  scrollSpeed = Math.min(SCROLL_BASE + frameCount * SPEED_INC, SCROLL_MAX);

  // 更新难度阶段
  const newStage = getDifficultyStage(currentHeight);
  if (newStage !== currentStage) {
    currentStage = newStage;
    stageFlash = 30;
    playMilestone();
  }

  // 更新关卡区域
  const newZone = getCurrentZone(currentHeight);
  if (newZone !== currentZone) {
    currentZone = newZone;
    showZoneAnnounce(newZone);
  }

  // 公告计时器
  if (zoneAnnounceTimer > 0) zoneAnnounceTimer--;

  // 护盾计时器
  if (shieldActive) {
    shieldTimer -= 16.67; // 约60fps
    if (shieldTimer <= 0) { shieldActive = false; shieldTimer = 0; }
  }

  // 冰面摩擦（冰面平台额外减速）
  let frictionMult = 0.82;
  for (const p of platforms) {
    if (p.type === PLAT_TYPE.ICE && drone.onGround) {
      const onThis = (
        drone.x + DRONE_W > p.x + 4 &&
        drone.x < p.x + p.w - 4 &&
        Math.abs(drone.y + DRONE_H - p.y) < 6
      );
      if (onThis) frictionMult = 0.95; // 更滑，减速更慢
    }
  }

  // 左右移动
  if (keys.left)  drone.vx = -MOVE_SPEED;
  else if (keys.right) drone.vx = MOVE_SPEED;
  else drone.vx *= frictionMult; // 缓停（冰面更滑）

  // 重力（随难度阶段轻微增加）
  drone.vy += GRAVITY_BASE * currentStage.gravMult;

  // 位移
  drone.x += drone.vx;
  drone.y += drone.vy;

  // 水平环绕
  if (drone.x + DRONE_W < 0)  drone.x = W;
  if (drone.x > W)             drone.x = -DRONE_W;

  // 落地检测
  drone.onGround = false;
  checkPlatformCollision();

  // 移动平台逻辑
  for (const p of platforms) {
    if (p.type === PLAT_TYPE.MOVING && p.visible) {
      p.x += p.vx;
      // 碰到边界反弹
      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
      if (p.x + p.w > W) { p.x = W - p.w; p.vx = -Math.abs(p.vx); }
      // 同步更新无人机位置（当无人机在平台上时）
      if (drone.onGround && Math.abs(drone.y + DRONE_H - p.y) < 8) {
        if (drone.x + DRONE_W > p.x && drone.x < p.x + p.w) {
          drone.x += p.vx;
        }
      }
    }

    // 断裂平台倒计时
    if (p.type === PLAT_TYPE.BREAKABLE && p.breakTimer > 0 && drone.onGround) {
      const onThis = (
        drone.x + DRONE_W > p.x + 4 &&
        drone.x < p.x + p.w - 4 &&
        Math.abs(drone.y + DRONE_H - p.y) < 8
      );
      if (onThis) p.breakTimer--;
      if (p.breakTimer <= 0) {
        p.visible = false;
        playBreak();
      }
    }
  }

  // 自动跳跃
  autoJump();

  // 滚动世界
  scrollWorld();
  managePlatforms();

  // 更新障碍物
  updateHazards();
  updateWindZones();
  updatePowerups();

  // 粒子
  updateParticles();

  // 更新高度
  if (currentHeight > bestHeight) bestHeight = currentHeight;
  scoreDisplay.textContent = currentHeight + ' m';
  bestDisplay.textContent  = bestHeight + ' m';

  // 里程碑音效（每50米一次）
  if (currentHeight > 0 && currentHeight >= lastMilestone + 50) {
    lastMilestone = Math.floor(currentHeight / 50) * 50;
    playMilestone();
  }

  // 失败判定：无人机超出屏幕底部
  if (drone.y > H + 60) {
    triggerGameOver();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawParticles();
  drawWindZones();

  for (const p of platforms) drawPlatform(p);
  drawHazards();
  drawPowerups();

  if (state === 'running' || state === 'over') {
    drawDrone(drone.x, drone.y, drone.vy);
    if (shieldActive) drawShield();
  }

  // 护盾计时条（顶部）
  if (shieldActive && shieldTimer > 0) {
    const ratio = shieldTimer / SHIELD_DURATION;
    ctx.fillStyle = '#00ffcc66';
    ctx.fillRect(0, 0, W * ratio, 3);
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(0, 0, W * ratio, 2);
  }

  // 阶段升级闪光
  if (stageFlash > 0) {
    const alpha = (stageFlash / 30) * 0.35;
    ctx.fillStyle = currentStage.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    stageFlash--;

    // 阶段标签大字提示
    if (stageFlash > 10) {
      ctx.save();
      ctx.font = `bold ${32 + stageFlash}px Courier New`;
      ctx.fillStyle = currentStage.color;
      ctx.globalAlpha = stageFlash / 30;
      ctx.shadowColor = currentStage.color;
      ctx.shadowBlur = 20;
      ctx.textAlign = 'center';
      ctx.fillText('▲ ' + currentStage.label + ' ▲', W / 2, H / 2 - 20);
      ctx.font = '16px Courier New';
      ctx.fillText('速度提升！', W / 2, H / 2 + 20);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  // 速度指示条（右侧竖条 + 阶段标签）
  if (state === 'running') {
    const ratio = (scrollSpeed - SCROLL_BASE) / (SCROLL_MAX - SCROLL_BASE);
    const barH = (H - 80) * ratio;
    const barY = H - 40 - barH;

    // 颜色渐变：随阶段变化
    const stageColor = currentStage.color;
    ctx.fillStyle = stageColor + 'bb';
    ctx.fillRect(W - 10, barY, 6, barH);

    // 顶部发光圆点
    ctx.beginPath();
    ctx.arc(W - 7, barY, 4, 0, Math.PI * 2);
    ctx.fillStyle = stageColor;
    ctx.shadowColor = stageColor;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    // 阶段标签（旋转竖排）
    ctx.save();
    ctx.translate(W - 7, H - 20);
    ctx.rotate(-Math.PI / 2);
    ctx.font = 'bold 9px Courier New';
    ctx.fillStyle = stageColor;
    ctx.textAlign = 'center';
    ctx.fillText(currentStage.label, 0, 0);
    ctx.restore();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  游戏开始 / 结束
// ============================================================
function startGame() {
  initAudio();
  playStart();
  lastMilestone = 0;
  initGame();
  state = 'running';
  startScreen.style.display = 'none';
  gameOverScr.classList.remove('show');
  scoreDisplay.textContent = '0 m';
}

function triggerGameOver() {
  state = 'over';
  playGameOver();
  finalScore.textContent = currentHeight + ' m';
  finalStage.textContent = currentStage.label;
  finalStage.style.color = currentStage.color;
  finalStage.style.textShadow = `0 0 8px ${currentStage.color}`;
  finalBest.textContent  = bestHeight + ' m';
  gameOverScr.classList.add('show');
}

// ============================================================
//  输入控制
// ============================================================
document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft')  { keys.left  = true; e.preventDefault(); }
  if (e.code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'idle' || state === 'over') startGame();
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft')  keys.left  = false;
  if (e.code === 'ArrowRight') keys.right = false;
});

// 点击开始/重玩
startScreen.addEventListener('click', () => {
  if (state === 'idle') startGame();
});
gameOverScr.addEventListener('click', () => {
  if (state === 'over') startGame();
});

// 移动端触摸（简单左右分屏）
canvas.addEventListener('touchstart', e => {
  if (state === 'idle' || state === 'over') { startGame(); return; }
  const tx = e.touches[0].clientX;
  const rect = canvas.getBoundingClientRect();
  const rx = tx - rect.left;
  if (rx < W / 2) keys.left = true;
  else keys.right = true;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', () => {
  keys.left = false; keys.right = false;
});

// ============================================================
//  启动
// ============================================================
// 首次交互时初始化音频（绕过浏览器自动播放策略）
document.addEventListener('click', () => { initAudio(); }, { once: true });
document.addEventListener('keydown', () => { initAudio(); }, { once: true });

initGame();
gameLoop();
</script>
</body>
</html>
